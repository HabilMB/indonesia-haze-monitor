name: CI

# Checks code only: no secrets and no BigQuery access, so it is safe on pull requests.
# Writing to the production datasets is the Daily refresh workflow's job alone.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ingestion/requirements-dev.txt
            ingestion/requirements.txt
            dbt/requirements.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r ingestion/requirements-dev.txt -r dbt/requirements.txt -r dashboard/requirements.txt

      - name: pytest (ingestion)
        run: python -m pytest ingestion -v

      - name: pytest (dashboard)
        run: python -m pytest dashboard -v

      - name: dbt parse
        # profiles.yml reads these at parse time; parse never connects, so placeholders are enough.
        env:
          GCP_PROJECT_ID: ci-placeholder
          GOOGLE_APPLICATION_CREDENTIALS: /dev/null
        run: dbt parse --project-dir dbt --profiles-dir dbt --no-partial-parse
