version: 2

models:
  - name: stg_cities
    description: City seed with a slug id; the only source of city coordinates.
    columns:
      - name: city_id
        data_tests: [unique, not_null]

  - name: stg_firms__hotspots
    description: FIRMS detections, typed and renamed. All confidence levels kept.
    columns:
      - name: hotspot_id
        description: SHA-256 of satellite|latitude|longitude|acq_date|acq_time.
        data_tests: [unique, not_null]
      - name: confidence_level
        data_tests:
          - accepted_values:
              arguments:
                values: [low, nominal, high]

  - name: stg_open_meteo__air_quality_hourly
    description: Modeled hourly air quality per city (CAMS via Open-Meteo), UTC.
    columns:
      - name: pm2_5
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 5000}
      - name: pm10
        data_tests:
          - in_range:
              arguments: {min_value: 0, max_value: 5000}

unit_tests:
  - name: stg_cities_builds_slug_id
    model: stg_cities
    given:
      - input: ref('cities')
        rows:
          - {city: "Palangka Raya", province: "Kalimantan Tengah", latitude: -2.21, longitude: 113.92}
    expect:
      rows:
        - {city_id: "palangka_raya", city_name: "Palangka Raya", province: "Kalimantan Tengah", latitude: -2.21, longitude: 113.92}

  - name: stg_firms_parses_time_confidence_daynight
    model: stg_firms__hotspots
    given:
      - input: source('raw', 'firms_hotspots')
        rows:
          - {latitude: -2.5, longitude: 113.9, acq_date: "2026-10-17", acq_time: "0518", confidence: "n", daynight: "D", satellite: "N", frp: 4.4, bright_ti4: 330.1, bright_ti5: 295.0, ingested_at: "2026-10-20 07:00:00"}
          - {latitude: -2.6, longitude: 113.8, acq_date: "2026-10-18", acq_time: "0005", confidence: "l", daynight: "N", satellite: "N", frp: 1.0, bright_ti4: 300.0, bright_ti5: 290.0, ingested_at: "2026-10-20 07:00:00"}
    expect:
      rows:
        - {acquired_at: "2026-10-17 05:18:00", confidence_level: "nominal", is_daytime: true}
        - {acquired_at: "2026-10-18 00:05:00", confidence_level: "low", is_daytime: false}

  - name: stg_air_quality_maps_city_and_date
    model: stg_open_meteo__air_quality_hourly
    given:
      - input: source('raw', 'air_quality_hourly')
        rows:
          - {city: "Palangka Raya", time: "2026-10-17 23:00:00", date: "2026-10-17", pm2_5: 61.5, pm10: 80.0, us_aqi: 154}
    expect:
      rows:
        - {city_id: "palangka_raya", city_name: "Palangka Raya", measured_at: "2026-10-17 23:00:00", date_utc: "2026-10-17", pm2_5: 61.5}
