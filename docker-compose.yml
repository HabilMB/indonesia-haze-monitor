# Local Airflow (LocalExecutor) running the haze pipeline against BigQuery.
# Adapted from the official Airflow 3.3.2 compose file, without Celery/Redis/triggerer.
# Values come from .env (see .env.example); a missing one stops compose before anything starts.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  image: haze-airflow:local
  # Host uid, so the container can read the 0600 key in secrets/.
  user: "${AIRFLOW_UID:?set AIRFLOW_UID in .env (id -u)}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in .env (openssl rand -hex 32)}
    FIRMS_MAP_KEY: ${FIRMS_MAP_KEY:?set FIRMS_MAP_KEY in .env}
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:?set GCP_PROJECT_ID in .env}
    GOOGLE_APPLICATION_CREDENTIALS: /opt/pipeline/secrets/loader-sa.json
    # The repo is mounted read-only, so dbt writes its artifacts elsewhere.
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./ingestion:/opt/pipeline/ingestion:ro
    - ./dbt:/opt/pipeline/dbt:ro
    - ./secrets:/opt/pipeline/secrets:ro
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    # Root only to hand the log volume to AIRFLOW_UID; the entrypoint then migrates the DB and creates the admin.
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - chown -R "${AIRFLOW_UID}:0" /opt/airflow/logs && exec /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in .env}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:
